# Main checks. Budget: private repo, 2,000 Actions minutes/month (D-010), so this runs
# only on PRs, pushes to main and manual runs, and cancels superseded runs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks git --redact --no-banner .

  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        # An empty image skips the service on the SQLite leg.
        image: ${{ matrix.db == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm
          POSTGRES_DB: itsm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itsm" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://itsm:itsm@localhost:5432/itsm_test' || '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Lint, format, types, layer contracts
        if: matrix.db == 'sqlite'
        run: |
          uv run ruff check . ../scripts
          uv run ruff format --check . ../scripts
          uv run mypy
          uv run mypy ../scripts/dev.py
          uv run lint-imports
      - name: Tests with coverage
        run: |
          uv run pytest --cov --cov-report=term:skip-covered --cov-report=xml
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          # P5.3: domain and services on their own (the same gate as scripts/dev.py)
          uv run coverage report --include='app/domain/*,app/services/*' --fail-under=80 --format=total
      - uses: actions/upload-artifact@v4
        if: matrix.db == 'sqlite'
        with:
          name: coverage-backend
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: frontend and client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Lint, format, types, tests, build
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build
      - name: e2e type-check
        run: npx tsc -p .
        working-directory: e2e
      - name: Generated client is up to date
        run: uv run scripts/dev.py check-client
